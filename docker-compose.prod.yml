# docker-compose.prod.yml — EC2 production deployment
#
# Pulls the pre-built image from GHCR (pushed by CI on every main merge).
# No build step on the server: just `make deploy` or `docker compose -f docker-compose.prod.yml up -d`.
#
# Prerequisites on the EC2 host:
#   1.  sudo apt install docker.io docker-compose-plugin
#   2.  echo $CR_PAT | docker login ghcr.io -u <github-user> --password-stdin
#   3.  cp .env.example .env && nano .env   # fill in all REQUIRED values
#   4.  make deploy                         # or: docker compose -f docker-compose.prod.yml up -d
#
# Automatic rolling updates:
#   Watchtower polls GHCR every 5 minutes and recreates containers when a new
#   image is pushed.  CR_PAT must be set in .env (read-only package scope only).

name: scientific-os-prod

services:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/mirofadlalla/scientific-operating-system:latest
    container_name: scientific-os-backend
    restart: unless-stopped
    pull_policy: always                          # always pull on `compose up`
    env_file:
      - path: .env
        required: true
    environment:
      # Docker-network service addresses (win over .env values)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      START_MCP_SERVER: "${START_MCP_SERVER:-1}"
      MCP_SERVER_PORT: "${MCP_SERVER_PORT:-8001}"
    volumes:
      - backend_data:/data
    depends_on:
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks: [scientific-os-network]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Expose only to the internal network; Nginx terminates TLS externally.
    expose: ["7860"]
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # ── Nginx reverse proxy (TLS termination + HTTP→HTTPS redirect) ───────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: scientific-os-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro      # place your cert.pem + key.pem here
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks: [scientific-os-network]

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scientific-os-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [scientific-os-network]
    expose: ["6379"]                             # not published to the host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Weaviate vector DB ───────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:${WEAVIATE_VERSION:-latest}
    container_name: scientific-os-weaviate
    restart: unless-stopped
    expose: ["8080", "50051"]                    # not published to the host
    networks: [scientific-os-network]
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Watchtower — automatic image updates ─────────────────────────────────────
  # Polls GHCR every 5 minutes; recreates containers when a new :latest is found.
  # Remove this service if you prefer manual `make deploy` rollouts.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: scientific-os-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_SCOPE: "scientific-os-prod"    # only watches containers in this compose project
      # GHCR credentials (read-only PAT, package:read scope only)
      REPO_USER: "${GHCR_USER}"
      REPO_PASS: "${CR_PAT}"
    command: --scope scientific-os-prod --interval 300
    networks: [scientific-os-network]

networks:
  scientific-os-network:
    driver: bridge

volumes:
  backend_data:
  redis_data:
  weaviate_data:
  nginx_logs:
