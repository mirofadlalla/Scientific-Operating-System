# Backend + the services it depends on. Frontend is deployed separately (Vercel).
#   cp .env.example .env   # add GROQ_API_KEY, SECRET_KEY, MONGODB_URI …
#   docker compose up --build
name: scientific-os

services:
  backend:
    build:
      context: .
      target: runtime
      args:
        PRELOAD_MODEL: ${PRELOAD_MODEL:-0}          # 1 = bake HF model in image (adds ~560 MB)
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large-instruct}
    image: scientific-os-backend:latest
    container_name: scientific-os-backend
    ports:
      - "${HOST_PORT:-7860}:7860"
    env_file:
      - path: .env
        required: false
    environment:
      # Docker-network wiring — these win over anything in .env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      # Chemical agent → MCP server started by docker/entrypoint.sh in this container
      START_MCP_SERVER: ${START_MCP_SERVER:-1}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-8001}
    volumes:
      - backend_data:/data                           # persistent RAG index
      # Only if you build with PRELOAD_MODEL=0, keep the model across recreations:
      # - hf_cache:/opt/hf
    depends_on:
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks: [scientific-os-network]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    # The e5-large embedding model needs roughly 3 GB of RAM. Uncomment to cap:
    # mem_limit: 4g

  redis:
    image: redis:7-alpine
    container_name: scientific-os-redis
    ports:
      - "127.0.0.1:6379:6379"                        # localhost only
    networks: [scientific-os-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  weaviate:
    # Pin this to the version your existing weaviate_data volume was created with:
    #   WEAVIATE_VERSION=1.xx.y docker compose up
    image: semitechnologies/weaviate:${WEAVIATE_VERSION:-latest}
    container_name: scientific-os-weaviate
    ports:
      - "127.0.0.1:8080:8080"                        # localhost only (anonymous access is on)
      - "127.0.0.1:50051:50051"
    networks: [scientific-os-network]
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

networks:
  scientific-os-network:
    driver: bridge

volumes:
  backend_data:
  weaviate_data:
  # hf_cache:
