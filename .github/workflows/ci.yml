name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same installer the Dockerfile uses (uv), cached on requirements.txt.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      # torch is intentionally NOT in requirements.txt (see
      # scripts/compile-requirements.sh). Tests don't need it: sentence-transformers
      # and the HF embedding classes are imported lazily inside the providers.
      # `uv pip check` is skipped here because it would flag sentence-transformers
      # for the missing torch; the docker job runs it with CPU torch installed.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --no-deps --only-binary :all: -r requirements.txt
          uv pip install pytest pytest-asyncio

      # conftest.py sets dummy GROQ_API_KEY / SECRET_KEY / service URLs, and the
      # tests mock Redis, Weaviate and the Groq API, so no secrets or services
      # are needed here.
      # Includes tests/test_frontend_contract.py, which checks that every API path
      # the React app calls exists on the backend and that the /metrics payload has
      # the keys the Monitor page reads.
      - name: Run tests
        run: uv run --no-sync pytest tests/ -v --tb=short

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Vite 8 needs Node >= 20.19 / 22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Root Dockerfile (runtime target), same as docker-compose.yml.
      # PRELOAD_MODEL stays 0 so CI doesn't download the ~560 MB embedding model.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          push: false
          tags: scientific-os-backend:ci
          build-args: |
            PRELOAD_MODEL=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile also asserts this at build time; this re-checks the final
      # runtime image so a regression can't slip in through another stage.
      - name: Verify image is CPU-only
        run: |
          docker run --rm --entrypoint python scientific-os-backend:ci - <<'PY'
          import importlib.metadata as md, sys, torch
          bad = sorted(d.metadata["Name"] for d in md.distributions()
                       if d.metadata["Name"].lower().startswith(("nvidia-", "cuda-", "triton")))
          print("torch", torch.__version__, "| cuda:", torch.version.cuda, "| gpu pkgs:", bad)
          sys.exit(1 if (torch.version.cuda is not None or bad or torch.cuda.is_available()) else 0)
          PY
          docker image inspect scientific-os-backend:ci --format 'image size: {{.Size}} bytes'

      # Boots the real image and hits the endpoints the frontend depends on,
      # including a CORS preflight from a browser origin.
      - name: Container integration smoke test
        env:
          ORIGIN: https://my-app.vercel.app
        run: |
          # jina + dummy key: avoids downloading the ~2 GB HF embedding model in CI.
          docker run -d --name backend -p 7860:7860 \
            -e GROQ_API_KEY=ci-dummy \
            -e SECRET_KEY=ci-dummy-secret-key-at-least-32-bytes-long \
            -e EMBEDDING_PROVIDER=jina -e JINA_API_KEY=ci-dummy \
            -e START_MCP_SERVER=0 \
            scientific-os-backend:ci

          # Give uvicorn a moment to bind the port before the first probe.
          sleep 3

          # Wait up to 120 s for /health to respond.  Exit early if the
          # container process dies (docker inspect exitCode != 0 means crashed).
          for i in $(seq 1 60); do
            EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' backend)
            STATUS=$(docker inspect --format='{{.State.Status}}' backend)
            if [ "$STATUS" != "running" ]; then
              echo "Container exited unexpectedly (status=$STATUS, exitCode=$EXIT_CODE)" >&2
              docker logs backend >&2
              exit 1
            fi
            curl -fsS http://localhost:7860/health && break
            sleep 2
          done
          # Final authoritative check — fails the step if the loop exhausted.
          curl -fsS http://localhost:7860/health

          curl -fsS http://localhost:7860/api/v1/metrics | python -c "
          import json, sys
          d = json.load(sys.stdin)
          for k in ('uptime', 'requests', 'errors', 'latency', 'agents', 'tokens'):
              assert k in d, f'/metrics missing {k}'
          "
          curl -fsS "http://localhost:7860/api/v1/metrics/requests?limit=5" > /dev/null
          curl -fsS http://localhost:7860/api/v1/rag/status > /dev/null

          # CORS preflight, as sent by the browser for the frontend's JSON POSTs
          curl -fsS -D - -o /dev/null -X OPTIONS http://localhost:7860/api/v1/orchestrate \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            | tee /dev/stderr | grep -iq '^access-control-allow-origin:'

      - name: Container logs
        if: always()
        run: docker logs backend 2>&1 | tail -100 || true

