# nginx/nginx.conf — reverse proxy for Scientific OS on EC2
#
# Terminates TLS, forces HTTPS, and forwards traffic to the backend container
# on the internal Docker network.
#
# TLS certs:
#   Place your certificate at  nginx/certs/cert.pem
#   Place your private key at  nginx/certs/key.pem
#
#   Free certs via Certbot (recommended on EC2):
#     sudo certbot certonly --standalone -d api.yourdomain.com
#     # then symlink / copy to ./nginx/certs/
#
# To reload config without downtime:
#   docker exec scientific-os-nginx nginx -s reload

events {
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Security headers (applied to all server blocks) ───────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin"   always;

    # ── Timeouts / buffer tuning for streaming + voice endpoints ─────────────
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout  10s;
    client_max_body_size  50m;      # allow audio file uploads up to 50 MB

    # ── Upstream (backend container on the internal Docker network) ───────────
    upstream backend {
        server backend:7860;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge through before redirecting.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;          # replace with your domain in production

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Modern TLS-only config (TLS 1.2+ , strong ciphers)
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Health probe (no auth required) ──────────────────────────────────
        location = /health {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_http_version 1.1;
            access_log         off;
        }

        # ── WebSocket — voice pipeline ────────────────────────────────────────
        location /api/v1/ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;    # keep WS connections alive for voice sessions
        }

        # ── All other API / docs traffic ──────────────────────────────────────
        location / {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";   # enable keepalive to upstream
        }
    }
}
